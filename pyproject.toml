[project]
name = "notebooklm-clone"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    # Intentional graceful-degradation pattern: broad excepts always log + fall back
    # (dense->tfidf, llm->mock, tts->silent). Never bare, never silent.
    "BLE001",
    # Silent fallbacks are deliberate: optional deps, best-effort caches/progress.
    "S110",
    "S112",
]
